[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "firstsky"
description = "FirstSky — Reddit-to-short-video toolkit: fetch, rank, TTS, music, b-roll, subtitles, mux."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "requests>=2.28.0",
    "colorama>=0.4.6",
    "fake-useragent>=1.4.0",
    "pyttsx3>=2.90",
    "gTTS>=2.5.1",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
firstsky = "resyco.cli:main"

[tool.setuptools.packages.find]
where = ["folders"]

[tool.setuptools.dynamic]
version = { attr = "resyco.constants.__version__" }
